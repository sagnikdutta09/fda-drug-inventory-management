<template>
    <lightning-card>
        <div class="header-container">

            <div class="greeting-section">
                <p class="greeting">
                    {greeting}
                </p>

                <h1 class="title">
                    {title}
                </h1>
            </div>

            <div class="user-details">
                <p class="details-heading"></p>

                <div class="detail-row">
                    <span class="detail-label">Name : </span>
                    <span class="detail-value">{userDetails.name}</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Profile : </span>
                    <span class="detail-value">{userDetails.profile}</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Email : </span>
                    <span class="detail-value">{userDetails.email}</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Location : </span>
                    <span class="detail-value">{userDetails.location}</span>
                </div>
            </div>

            <div class="timeDate-container">

                <div class="timeDate-section">
                    <p class="timeDate">
                        {fullTime}
                    </p>
                </div>

                <div class="timeDate-section">
                    <p class="timeDate">
                        {fullDate}
                    </p>
                </div>

            </div>
        </div>
    </lightning-card>
</template>
